<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Geek Legends</title>

  <!-- CSS da página de login (igual estilo) -->
  <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

  <!-- Cabeçalho com logo e menu -->
  <header class="cabecalho">
    <div class="logo">
      <div class="icone-logo">GL</div>

      <div>
        <h1>Geek Legends</h1>
        <p>Produtos Dignos de Lenda</p>
      </div>
    </div>

    <nav>
      <a href="index.html">Início</a>
      <a href="produtos.html">Produtos</a>
      <a href="sobre.html">Sobre</a>
      <a href="login.html">Login</a>
      <a href="carrinho.html" class="link-carrinho"> 🛒 <span id="contador-carrinho">0</span> </a>
    </nav>
  </header>

  <main class="conteudo-login">

    <!-- Logo e título do cadastro -->
    <section class="topo-login">
      <div class="icone-login">GL</div>
      <h2>Crie Sua Conta!</h2>
      <p>Junte-se à comunidade Geek Legends</p>
    </section>

    <!-- Card com formulário -->
    <section class="card-login">
      <form id="formLogin">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="📝  Seu nome" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="✉️  seu@email.com" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="🔒  ********" required>

        <button type="submit">⚡ Criar Conta</button>
      </form>

      <p class="cadastro">
        Já tem uma conta? <a href="login.html">Faça login</a>
      </p>
    </section>

    <!-- Rodapé -->
    <footer class="rodape">
      <p>© 2026 Geek Legends - Todos os direitos reservados.</p>
    </footer>

  </main>

  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/ui.js"></script>
</body>

</html>
